name: ITCH CI

on: 
  push:
    branches[main]
  pull_request:
    branches[main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
    env:
        CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc clang 

      - name: CMake configurations
        run: |
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: |
           cmake --build build/${{ matrix.preset }}




